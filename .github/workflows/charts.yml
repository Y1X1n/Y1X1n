name: Profile charts

on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: profile-charts
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ---------- 1. 语言分布（来自 GitHub languages API，一次性、可靠） ----------
      - name: Fetch language stats
        uses: actions/github-script@v7
        with:
          script: |
            const axios = require('axios');
            const me = context.repo.owner;
            const token = process.env.GITHUB_TOKEN;
            const repos = [];
            for (let p = 1; p <= 5; p++) {
              const r = await axios.get(`https://api.github.com/users/${me}/repos?per_page=100&page=${p}&type=owner`, {
                headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
              });
              if (!r.data.length) break;
              repos.push(...r.data);
            }
            const langs = {};
            for (const repo of repos) {
              if (repo.fork) continue;
              try {
                const l = await axios.get(repo.languages_url, {
                  headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
                });
                for (const [k, v] of Object.entries(l.data)) langs[k] = (langs[k] || 0) + v;
              } catch (e) { core.info(`lang fetch failed for ${repo.name}`); }
            }
            const total = Object.values(langs).reduce((a, b) => a + b, 0);
            const sorted = Object.entries(langs).sort((a, b) => b[1] - a[1]).slice(0, 10)
              .map(([k, v]) => ({ lang: k, bytes: v, pct: +((v / total) * 100).toFixed(1) }));
            require('fs').writeFileSync('data/langs.json', JSON.stringify({ total, langs: sorted }, null, 2));
            console.log(`aggregated ${sorted.length} languages, total ${total} bytes`);

      # ---------- 2. 提交日历（GraphQL，单请求，不会超时） ----------
      - name: Fetch contribution calendar
        uses: actions/github-script@v7
        with:
          script: |
            const axios = require('axios');
            const me = context.repo.owner;
            const token = process.env.GITHUB_TOKEN;
            let days = [];
            try {
              const r = await axios.post('https://api.github.com/graphql', {
                query: `query($login: String!) {
                  user(login: $login) {
                    contributionsCollection {
                      contributionCalendar {
                        weeks {
                          contributionDays { date contributionCount contributionLevel }
                        }
                      }
                    }
                  }
                }`,
                variables: { login: me },
              }, {
                headers: { Authorization: `token ${token}` },
              });
              const weeks = r.data.data.user.contributionsCollection.contributionCalendar.weeks;
              days = weeks.flatMap(w => w.contributionDays);
            } catch (e) {
              core.info(`calendar fetch failed: ${e.message}`);
            }
            require('fs').writeFileSync('data/calendar.json', JSON.stringify({ days }, null, 2));
            console.log(`calendar: ${days.length} days`);

      # ---------- 3. 渲染 SVG ----------
      - name: Render SVG
        run: |
          mkdir -p dist
          node scripts/render-charts.mjs data/langs.json data/calendar.json dist

      # ---------- 4. 提交回仓库 ----------
      - name: Push charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/
          git diff --cached --quiet || git commit -m "chore: update profile charts"
          git push