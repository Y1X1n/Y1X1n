name: Metrics

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 01:17 UTC / 每日更新
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Actions' built-in repo-scoped token is enough for public data.
          # No METRICS_TOKEN secret required.
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg

          # 基础信息 / base
          base: header, activity, community, repositories, metadata
          base_indepth: true

          # 插件 / plugins
          plugin_languages: true
          plugin_languages_limit: 10
          plugin_languages_details: true

          plugin_lines: true
          plugin_lines_sections: base

          plugin_stars: true
          plugin_stars_limit: 12

          plugin_topics: true
          plugin_topics_limit: 16

          plugin_habits: true
          plugin_habits_days: 30
          plugin_habits_facts: false

          plugin_repositories: true
          plugin_repositories_recent: true
          plugin_repositories_limit: 8
          plugin_repositories_affiliations: owner
