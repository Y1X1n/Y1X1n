name: Metrics

on:
  schedule:
    - cron: "17 1 * * *"   # 每天 UTC 01:17 更新 / update daily
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          # 基础信息
          base: header, title
          base_indepth: true
          # 插件
          plugin_community: true
          plugin_languages: true
          plugin_languages_details: true
          plugin_languages_limit: 8
          plugin_repositories: true
          plugin_repositories_limit: 8
          plugin_repositories_affiliations: owner
          plugin_lines: true
          plugin_lines_sections: enabled
          plugin_stars: true
          plugin_licenses: true
          plugin_habits: true
          plugin_habits_days: 30
          plugin_topics: true
          plugin_topics_limit: 12
          plugin_activity: false
