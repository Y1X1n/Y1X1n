name: Generate snake animation

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC / 每日更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/light.svg
            dist/dark.svg
            dist/single.svg

      - name: Commit snake to repo
        run: |
          mkdir -p output
          cp dist/light.svg output/github-snake-light.svg
          cp dist/dark.svg  output/github-snake-dark.svg
          cp dist/single.svg output/github-snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "snake unchanged"
          else
            git commit -m "chore: regenerate snake animation"
            git push
          fi